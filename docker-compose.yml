services:
  cecilia:
    build: .
    ports:
      # Nur localhost – Plesk-nginx proxied cecilia.rsservice.app auf diesen Port
      # und läuft auf demselben Host. Zugriff ausschliesslich über die Domain.
      - "127.0.0.1:30000:30000"
    env_file:
      - cecilia-chat/.env
    environment:
      - NODE_ENV=production
      - PUBLIC_DIR=/app
      - PORT=30000
    restart: unless-stopped
    volumes:
      # PFLICHT: Ohne diese Zeile sind bei jedem Neubau alle Konten weg.
      - ./data:/data
