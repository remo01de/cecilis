<!DOCTYPE html>
<html lang="de" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anmelden · Cecilia</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#15082A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cecilia">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script>
    // Farbmodus wie in der App, bevor die Seite gezeichnet wird
    try { if (localStorage.getItem('cecilia_theme') === 'day') document.documentElement.dataset.theme = 'day'; } catch (e) {}
  </script>
  <!-- Bewusst alles inline: diese Seite ist ohne Login erreichbar, chat.css und js/ nicht. -->
  <style>
    :root {
      --bg: #0F0420; --card: rgba(255,255,255,0.07); --stroke: rgba(255,255,255,0.14);
      --stroke-hot: rgba(255,111,203,0.5); --text-1: #FFFFFF; --text-2: #E8DCFF; --text-3: #B0A0CE;
      --pink: #FF6FCB; --field: rgba(255,255,255,0.08); --error-bg: rgba(255,111,160,0.14); --error: #FFB3D1;
      --grad-magic: linear-gradient(135deg,#FF6FCB 0%,#C9B4FF 50%,#7EE8FA 100%);
      --aurora: radial-gradient(ellipse at 15% 20%,rgba(255,111,203,0.25),transparent 50%),
                radial-gradient(ellipse at 85% 10%,rgba(126,232,250,0.18),transparent 55%),
                radial-gradient(ellipse at 50% 95%,rgba(201,180,255,0.2),transparent 55%),
                linear-gradient(180deg,#1D0B3A 0%,#2A0F4D 45%,#3D1466 100%);
    }
    [data-theme="day"] {
      --bg: #FFD3E7; --card: rgba(255,255,255,0.75); --stroke: rgba(42,15,51,0.12);
      --stroke-hot: rgba(243,83,181,0.45); --text-1: #2A0F33; --text-2: #5A2F66; --text-3: #784686;
      --pink: #D63A99; --field: #FFFFFF; --error-bg: rgba(214,58,153,0.1); --error: #A3206F;
      --aurora: radial-gradient(ellipse at 15% 20%,rgba(243,83,181,0.25),transparent 55%),
                radial-gradient(ellipse at 85% 10%,rgba(78,203,227,0.2),transparent 55%),
                linear-gradient(180deg,#FFEEF6 0%,#FFE0EE 55%,#FFD3E7 100%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: var(--aurora), var(--bg);
      background-attachment: fixed;
      color: var(--text-2);
      font: 400 16px/1.55 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
    main {
      width: min(400px, 100%);
      padding: 32px 26px 26px;
      border-radius: 32px;
      background: var(--card);
      border: 1px solid var(--stroke-hot);
      box-shadow: 0 24px 60px rgba(8,2,22,0.45);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    }
    .avatar {
      width: 84px; height: 84px; margin: 0 auto 14px;
      border-radius: 26px; overflow: hidden;
      background: var(--grad-magic);
      box-shadow: 0 0 28px rgba(255,111,203,0.5);
      display: grid; place-items: center; font-size: 38px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font: 400 36px/1.1 'Instrument Serif', Georgia, serif;
      color: var(--text-1); text-align: center;
    }
    .intro { text-align: center; margin: 6px 0 22px; color: var(--text-3); font-size: 15px; }
    label { display: block; font-weight: 600; color: var(--text-1); font-size: 14px; margin: 14px 0 6px; }
    .field {
      display: flex; align-items: center;
      border-radius: 16px; background: var(--field);
      border: 1px solid var(--stroke);
      transition: border-color 160ms, box-shadow 160ms;
    }
    .field:focus-within { border-color: var(--stroke-hot); box-shadow: 0 0 0 3px rgba(255,111,203,0.2); }
    /* Das runde Feld leuchtet schon; kein zusätzlicher eckiger Rahmen um das Eingabefeld */
    .field input:focus-visible { outline: none; }
    input {
      flex: 1; min-width: 0;
      padding: 13px 16px;
      background: transparent; border: none; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 16px; line-height: 1.3; /* 16px: kein iOS-Zoom */
    }
    .show-pw {
      flex: none; margin-right: 6px;
      padding: 8px 10px; border-radius: 12px;
      background: transparent; border: none;
      color: var(--text-3); font-family: inherit; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer;
    }
    .show-pw:hover { color: var(--text-1); }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      padding: 5px; border-radius: 999px;
      background: var(--field); border: 1px solid var(--stroke);
      margin-bottom: 6px;
    }
    .tabs button {
      min-height: 42px; border: none; border-radius: 999px;
      background: transparent; color: var(--text-3);
      font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: var(--grad-magic); color: #2A0526; }
    [role="tabpanel"][hidden] { display: none; }
    .error {
      margin-top: 16px; padding: 10px 14px;
      border-radius: 14px; background: var(--error-bg); color: var(--error);
      font-size: 14px;
    }
    .error[hidden] { display: none; }
    button[type="submit"] {
      width: 100%; min-height: 50px; margin-top: 22px;
      border: none; border-radius: 999px;
      background: var(--grad-magic); color: #2A0526;
      font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; cursor: pointer;
      box-shadow: 0 0 24px rgba(255,111,203,0.45);
      transition: transform 160ms, opacity 160ms;
    }
    button[type="submit"]:hover { transform: translateY(-1px); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .hint { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-3); }
    .hint + .hint { margin-top: 8px; }
    .hint a { color: var(--text-1); font-weight: 600; text-decoration-color: var(--pink); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">✨</div>
    <h1>Hallo!</h1>
    <p class="intro">Melde dich an, um mit Cecilia zu plaudern.</p>

    <div class="tabs" role="tablist" aria-label="Wie meldest du dich an?">
      <button type="button" role="tab" id="tabFamily" aria-selected="true" aria-controls="familyPanel">Familie</button>
      <button type="button" role="tab" id="tabChild" aria-selected="false" aria-controls="childPanel" tabindex="-1">Mein Kind-Login</button>
    </div>

    <div role="tabpanel" id="familyPanel" aria-labelledby="tabFamily">
    <form id="familyForm" novalidate>
      <label for="email">E-Mail</label>
      <div class="field"><input id="email" type="email" autocomplete="username" inputmode="email" required></div>
      <label for="password">Passwort</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="show-pw" data-toggle="password" aria-controls="password" aria-pressed="false">zeigen</button>
      </div>
      <p class="error" data-error role="alert" hidden></p>
      <button type="submit">Anmelden ✨</button>
    </form>
    </div>

    <div role="tabpanel" id="childPanel" aria-labelledby="tabChild" hidden>
    <form id="childForm" novalidate>
      <label for="username">Benutzername</label>
      <div class="field"><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <label for="childPassword">Passwort</label>
      <div class="field">
        <input id="childPassword" type="password" autocomplete="current-password" required>
        <button type="button" class="show-pw" data-toggle="childPassword" aria-controls="childPassword" aria-pressed="false">zeigen</button>
      </div>
      <p class="error" data-error role="alert" hidden></p>
      <button type="submit">Los geht's ✨</button>
    </form>
    </div>

    <p class="hint">Deinen Zugang bekommst du von deinen Eltern.</p>
    <p class="hint"><a href="/willkommen.html">Wer ist Cecilia? Hier stellt sie sich vor</a></p>
  </main>

  <script>
    // Nur Ziele auf dieser Seite zulassen (kein Weiterleiten auf fremde Seiten)
    function nextTarget() {
      const raw = new URLSearchParams(location.search).get('next') || '/';
      try {
        const u = new URL(raw, location.origin);
        if (u.origin !== location.origin || u.pathname.startsWith('/login.html')) return '/';
        return u.pathname + u.search + u.hash;
      } catch (e) {
        return '/';
      }
    }

    // Schon angemeldet? Mit Profil weiter, ohne Profil zur Profilwahl.
    fetch('/api/auth/session').then(r => r.json()).then(s => {
      if (s.loggedIn) location.replace(s.profile ? nextTarget() : '/profile.html?next=' + encodeURIComponent(nextTarget()));
    }).catch(() => {});

    // Reiter (Pfeiltasten wie bei WAI-ARIA Tabs)
    const tabs = [document.getElementById('tabFamily'), document.getElementById('tabChild')];
    function selectTab(tab) {
      tabs.forEach(t => {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      });
      tab.focus();
    }
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => selectTab(t));
      t.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') selectTab(tabs[(i + 1) % 2]);
      });
    });

    document.querySelectorAll('[data-toggle]').forEach(btn => {
      const input = document.getElementById(btn.dataset.toggle);
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'verbergen' : 'zeigen';
        btn.setAttribute('aria-pressed', String(show));
      });
    });

    const MESSAGES = {
      401: 'Das hat leider nicht geklappt. Prüf bitte deine Angaben.',
      403: 'Dieser Zugang ist gerade gesperrt. Frag bitte deine Eltern.',
      429: 'Zu viele Versuche. Warte bitte 15 Minuten und probier es dann nochmal.'
    };

    async function submit(form, url, payload, onOk) {
      const err = form.querySelector('[data-error]');
      const btn = form.querySelector('button[type="submit"]');
      const label = btn.textContent;
      err.hidden = true;
      if (Object.values(payload).some(v => !v)) {
        err.textContent = 'Bitte füll beide Felder aus.';
        err.hidden = false;
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Einen Moment …';
      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) return onOk(await res.json());
        err.textContent = MESSAGES[res.status] || 'Cecilia ist gerade nicht erreichbar. Probier es bitte später nochmal.';
      } catch (e) {
        err.textContent = 'Keine Verbindung. Bist du mit dem Internet verbunden?';
      }
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = label;
    }

    document.getElementById('familyForm').addEventListener('submit', e => {
      e.preventDefault();
      submit(e.target, '/api/auth/login',
        { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value },
        data => location.replace(data.profileSelected ? nextTarget() : '/profile.html?next=' + encodeURIComponent(nextTarget())));
    });

    document.getElementById('childForm').addEventListener('submit', e => {
      e.preventDefault();
      submit(e.target, '/api/auth/child-login',
        { username: document.getElementById('username').value.trim(), password: document.getElementById('childPassword').value },
        () => location.replace(nextTarget()));
    });
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
